version: general_topic_v0.1.0
labels:
  academic_research:
    description: 学术、科研、理论讨论、论文、课程中的专业知识
    minors:
      - mathematics
      - physics
      - chemistry
      - biology
      - computer_science
      - engineering
      - medicine
      - economics
      - psychology
      - philosophy
      - linguistics
      - history
      - interdisciplinary

  technology_engineering:
    description: 技术、工程、产品、系统、软件硬件实现
    minors:
      - artificial_intelligence
      - software_engineering
      - data_science
      - cybersecurity
      - hardware
      - robotics
      - telecommunications
      - product_design
      - user_experience
      - manufacturing

  business_management:
    description: 商业、组织管理、市场、运营、项目推进
    minors:
      - strategy
      - marketing_sales
      - finance_accounting
      - operations
      - human_resources
      - entrepreneurship
      - project_management
      - customer_success
      - procurement

