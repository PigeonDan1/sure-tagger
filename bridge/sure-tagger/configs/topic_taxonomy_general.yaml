  education_training:
    description: 教学、培训、考试、学习辅导
    minors:
      - lecture
      - tutorial
      - exam_preparation
      - classroom_discussion
      - language_learning
      - professional_training
      - mentoring

  culture_media_arts:
    description: 文化、媒体、娱乐、艺术、人文表达
    minors:
      - literature
      - music
      - film_tv
      - gaming
      - visual_art
