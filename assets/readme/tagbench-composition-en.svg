<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc">
  <title id="title">Tag-Bench composition</title>
  <desc id="desc">1,150 clips: 500 controlled synthetic clips, 350 AMI meeting clips, 150 FLEURS and LibriSpeech clips, and 150 DESED and FSD50K clips. Bars are scaled to the largest group.</desc>
  <rect x="1" y="1" width="1198" height="483" rx="22" fill="#FFFFFF" stroke="#DCE7E4" stroke-width="2"/>
  <text x="40" y="68" fill="#18302A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="700">Tag-Bench</text>
  <text x="1160" y="68" text-anchor="end" fill="#18302A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="700">1,150 clips</text>
  <path d="M40 95h1120" stroke="#DCE7E4" stroke-width="2"/>

  <text x="40" y="150" fill="#18302A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32">Controlled synthesis · agent validation</text>
  <text x="1160" y="150" text-anchor="end" fill="#0C806F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="38" font-weight="700">500</text>
  <rect x="40" y="169" width="1120" height="18" rx="9" fill="#EDF4F1"/>
  <rect x="40" y="169" width="1120" height="18" rx="9" fill="#1A9F7D"/>

  <text x="40" y="235" fill="#18302A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32">T1 · AMI meetings</text>
  <text x="1160" y="235" text-anchor="end" fill="#2878A3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="38" font-weight="700">350</text>
  <rect x="40" y="254" width="1120" height="18" rx="9" fill="#EDF4F1"/>
  <rect x="40" y="254" width="784" height="18" rx="9" fill="#3A93C6"/>

  <text x="40" y="320" fill="#18302A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32">T2 · FLEURS + LibriSpeech</text>
  <text x="1160" y="320" text-anchor="end" fill="#6A52B3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="38" font-weight="700">150</text>
  <rect x="40" y="339" width="1120" height="18" rx="9" fill="#EDF4F1"/>
  <rect x="40" y="339" width="336" height="18" rx="9" fill="#8064C8"/>

  <text x="40" y="405" fill="#18302A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32">T3 · DESED + FSD50K</text>
  <text x="1160" y="405" text-anchor="end" fill="#A86A27" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="38" font-weight="700">150</text>
  <rect x="40" y="424" width="1120" height="18" rx="9" fill="#EDF4F1"/>
  <rect x="40" y="424" width="336" height="18" rx="9" fill="#D28B44"/>
</svg>
