<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc">
  <title id="title">Tag-Bench 样本构成</title>
  <desc id="desc">共 1,150 条：受控合成 500 条，AMI 会议 350 条，FLEURS 与 LibriSpeech 150 条，DESED 与 FSD50K 150 条。条形长度以最大组为基准。</desc>
