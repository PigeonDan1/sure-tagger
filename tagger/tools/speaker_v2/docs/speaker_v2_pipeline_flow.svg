<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" role="img" aria-labelledby="title desc">
  <title id="title">Speaker v2 language-routed ASR and diarization pipeline</title>
  <desc id="desc">Standalone FireRed LID routes Chinese and English through the existing MOSS and FireRed consensus policy. Every other, mixed, unknown, or failed LID result selects Qwen3-ASR-0.6B text and the pinned official DiariZen timeline. Sortformer and Pyannote are disabled by default and diagnostic only.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5d6b70"/>
    </marker>
    <marker id="arrowAudit" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b6b36"/>
    </marker>
    <style>
      .title { font-family:'DejaVu Sans',sans-serif; font-size:28px; font-weight:700; fill:#172b33; }
      .subtitle { font-family:'DejaVu Sans',sans-serif; font-size:14px; fill:#516269; }
      .heading { font-family:'DejaVu Sans',sans-serif; font-size:17px; font-weight:700; fill:#172b33; }
      .body { font-family:'DejaVu Sans',sans-serif; font-size:13px; fill:#34484f; }
      .small { font-family:'DejaVu Sans',sans-serif; font-size:12px; fill:#52646b; }
      .route { font-family:'DejaVu Sans',sans-serif; font-size:13px; font-weight:700; fill:#34484f; }
      .box { stroke-width:2; rx:6; }
      .inner { stroke-width:1.4; rx:5; }
      .line { stroke:#5d6b70; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .audit-line { stroke:#8b6b36; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrowAudit); }
    </style>
  </defs>

  <rect width="1000" height="960" fill="#f7f8f7"/>
  <text class="title" x="500" y="42" text-anchor="middle">Speaker v2 language-routed pipeline</text>
  <text class="subtitle" x="500" y="66" text-anchor="middle">FireRed is limited to Chinese/English; all other ASR uses Qwen3</text>

  <rect class="box" x="370" y="90" width="260" height="55" fill="#ffffff" stroke="#72838a"/>
  <text class="heading" x="500" y="114" text-anchor="middle">UTTERANCE AUDIO</text>
  <text class="small" x="500" y="133" text-anchor="middle">sample.audio.path | full sample scope</text>
  <path class="line" d="M500 145 L500 175"/>

  <rect class="box" x="320" y="175" width="360" height="70" fill="#e7f1f5" stroke="#3d7386"/>
  <text class="heading" x="500" y="202" text-anchor="middle">STANDALONE FIRERED LID</text>
  <text class="body" x="500" y="224" text-anchor="middle">Audio-derived language code; also published as language evidence</text>

  <path class="line" d="M500 245 L500 265 L240 265 L240 290"/>
  <path class="line" d="M500 245 L500 265 L760 265 L760 290"/>
  <rect x="78" y="253" width="324" height="25" fill="#f7f8f7"/>
  <text class="route" x="240" y="271" text-anchor="middle">recognized zh/zh-* or en/en-*</text>
  <rect x="573" y="253" width="374" height="25" fill="#f7f8f7"/>
  <text class="route" x="760" y="271" text-anchor="middle">all other / mixed / unknown / LID failure</text>

  <rect class="box" x="45" y="290" width="390" height="230" fill="#edf7ef" stroke="#4a805c"/>
  <text class="heading" x="240" y="320" text-anchor="middle">CHINESE / ENGLISH ASR ROUTE</text>
  <text class="small" x="240" y="342" text-anchor="middle">MOSS and official DiariZen counts are collected</text>
  <rect class="inner" x="75" y="365" width="330" height="92" fill="#ffffff" stroke="#78a686"/>
  <text class="body" x="240" y="391" text-anchor="middle">both valid counts &lt;= 1: FireRedASR2-AED text</text>
  <text class="body" x="240" y="415" text-anchor="middle">otherwise: MOSS segment text</text>
  <text class="body" x="240" y="439" text-anchor="middle">C / M / O / X always use the MOSS timeline</text>
  <text class="small" x="240" y="488" text-anchor="middle">No ASR candidate fallback</text>
  <text class="small" x="240" y="507" text-anchor="middle">Missing counts do not form consensus</text>

  <rect class="box" x="565" y="290" width="390" height="350" fill="#fff7e7" stroke="#a47122"/>
  <text class="heading" x="760" y="320" text-anchor="middle">OTHER / MIXED / UNKNOWN</text>
  <text class="small" x="760" y="342" text-anchor="middle">Independent Qwen3 ASR and official DiariZen</text>

  <rect class="inner" x="590" y="360" width="340" height="42" fill="#ffffff" stroke="#c49a55"/>
  <text class="body" x="605" y="378">Qwen3-ASR-0.6B</text>
  <text class="small" x="915" y="395" text-anchor="end">multilingual ASR text</text>
  <rect class="inner" x="590" y="410" width="340" height="42" fill="#ffffff" stroke="#c49a55"/>
  <text class="body" x="605" y="428">Official DiariZen large-s80-v2</text>
  <text class="small" x="915" y="445" text-anchor="end">C / M / O / X timeline</text>
  <rect class="inner" x="590" y="460" width="340" height="42" fill="#ffffff" stroke="#c49a55"/>
  <text class="body" x="605" y="478">FireRed ASR is not invoked</text>
  <text class="small" x="915" y="495" text-anchor="end">language safety boundary</text>
  <rect class="inner" x="590" y="510" width="340" height="42" fill="#ffffff" stroke="#c49a55"/>
  <text class="body" x="605" y="528">LID failure follows this route</text>
  <text class="small" x="915" y="545" text-anchor="end">failed LID is unknown</text>
  <rect class="inner" x="590" y="560" width="340" height="42" fill="#ffffff" stroke="#c49a55"/>
  <text class="body" x="605" y="578">No cross-model fallback</text>
  <text class="small" x="915" y="595" text-anchor="end">selected failures stay missing</text>
  <text class="small" x="760" y="614" text-anchor="middle">Qwen3 text and DiariZen timeline validate independently</text>
  <text class="small" x="760" y="633" text-anchor="middle" fill="#8c3d31">FireRedASR2-AED never receives this audio</text>

  <rect class="box" x="447" y="390" width="106" height="78" fill="#fff0ed" stroke="#a44c3c"/>
  <text class="small" x="500" y="414" text-anchor="middle" fill="#8c3d31">NO CROSS-</text>
  <text class="small" x="500" y="433" text-anchor="middle" fill="#8c3d31">BRANCH</text>
  <text class="small" x="500" y="452" text-anchor="middle" fill="#8c3d31">FALLBACK</text>

  <path class="line" d="M240 520 C240 650 410 650 410 690"/>
  <path class="line" d="M760 640 C760 670 590 670 590 690"/>

  <rect class="box" x="300" y="690" width="400" height="92" fill="#ffffff" stroke="#536d77"/>
  <text class="heading" x="500" y="717" text-anchor="middle">SELECTED OUTPUT VALIDATION</text>
  <text class="small" x="500" y="739" text-anchor="middle">Pinned model paths and SHA verified before inference</text>
  <text class="small" x="500" y="757" text-anchor="middle">ASR text and speaker timeline validate independently</text>
  <text class="small" x="500" y="775" text-anchor="middle">selected model failure: missing | valid zero-turn: count = 0</text>

  <rect class="box" x="35" y="690" width="225" height="132" fill="#f0f1f1" stroke="#7a8589" stroke-dasharray="7 6"/>
  <text class="heading" x="147" y="718" text-anchor="middle">DIAGNOSTICS ONLY</text>
  <text class="body" x="147" y="745" text-anchor="middle">Sortformer / Pyannote</text>
  <text class="small" x="147" y="768" text-anchor="middle">disabled by default</text>
  <text class="small" x="147" y="789" text-anchor="middle">never public C / M / O / X</text>
  <text class="small" x="147" y="810" text-anchor="middle">cannot override selected branch</text>

  <rect class="box" x="755" y="690" width="210" height="132" fill="#fff4dc" stroke="#9a7534"/>
  <text class="heading" x="860" y="718" text-anchor="middle">INTERNAL ARTIFACT</text>
  <text class="small" x="860" y="744" text-anchor="middle">LID result and route</text>
  <text class="small" x="860" y="765" text-anchor="middle">runtime identity + raw output</text>
  <text class="small" x="860" y="786" text-anchor="middle">timeline / model chain</text>
  <text class="small" x="860" y="807" text-anchor="middle">errors and diagnostics</text>
  <path class="line" d="M700 736 L755 736"/>
  <path class="audit-line" d="M260 806 C430 840 650 840 755 806"/>

  <path class="line" d="M500 782 L500 850"/>
  <rect class="box" x="285" y="850" width="430" height="82" fill="#e8f4eb" stroke="#3f7b55"/>
  <text class="heading" x="500" y="879" text-anchor="middle">DIRECT PUBLIC OUTPUT</text>
  <text class="body" x="500" y="903" text-anchor="middle">ASR transcript | speaker count / present / multi</text>
  <text class="body" x="500" y="923" text-anchor="middle">change count / change | overlap ratio / overlap | profiles</text>
</svg>
