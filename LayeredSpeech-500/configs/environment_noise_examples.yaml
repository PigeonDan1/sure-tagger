# Add one noise_path to a scene. Paths are relative to this config directory.
# ``environment`` is the scene-level acoustic label; ``noise_asset_id`` is the
# DEMAND directory code used only to make the example path easy to identify.
# The library contains five clips for every DEMAND environment (clip00..clip04).

noise_examples:
  # Domestic
  - environment: residential
    noise_environment: residential
    noise_asset_id: DKITCHEN
    snr_db: 15.0
    noise_path: ../../background_noise_library/demand_16k/DKITCHEN/DKITCHEN_ch01_clip00.wav
  - environment: residential
    noise_environment: residential
    noise_asset_id: DLIVING
    snr_db: 15.0
    noise_path: ../../background_noise_library/demand_16k/DLIVING/DLIVING_ch01_clip00.wav
