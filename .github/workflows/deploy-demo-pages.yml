name: Deploy interactive demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public demo files
        run: node sure-tagger-main/demo/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
